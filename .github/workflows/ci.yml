name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13" # Matches package.json.
      - name: Install locked dependencies and generate environment types
        run: bun install --frozen-lockfile
      - name: Full automated test suite
        run: bun test
      - name: Workspace typechecks
        run: bun run check-types
      - name: Lint (non-mutating)
        run: bunx oxlint
      # No runtime credentials/services. Build remains a configured local check;
      # see README for the offline-build boundary and existing baseline blockers.
